name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      kantor_ref:
        description: Full Kantor commit SHA to build instead of this run's commit (build only, never deploys)
        required: false
        default: ""

# Production deploys (main) share one group and are never cancelled: a run
# killed mid switch-to-configuration can leave the server half-switched. A
# newer main push waits and supersedes only a still-pending one. PR runs and
# workflow_dispatch on other branches never deploy, so each ref has its own
# group and a newer push cancels the older run.
concurrency:
  group: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && 'deploy-production' || format('ci-{0}', github.ref) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref != 'refs/heads/main' }}

jobs:
  backend-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Run Go tests
        run: go test ./...

  frontend-build:
    name: Frontend Build Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  build:
    # main pushes build and may deploy (see AUTO_DEPLOY below). A manual run
    # builds on any branch, so a workflow change can be tried before merge.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs:
      - backend-tests
      - frontend-build
    runs-on: ubuntu-latest
    # A stalled run must not hold the never-cancelled deploy-production
    # group for GitHub's 6-hour default (main runs took 2-16 minutes so far;
    # the first LibreOffice deploy downloads ~0.8 GiB more).
    timeout-minutes: 120
    env:
      # The nixpkgs revision production runs. nix-anywhere locks an older one
      # (2026-03-27), and building with it would downgrade the whole host.
      # Drop this override once nix-anywhere locks this revision (or a newer
      # one rolled out on purpose).
      NIXPKGS_REV: e52c192be9d7b2c4bd4aed326c8731b35f8bb75c
    outputs:
      system-path: ${{ steps.build.outputs.path }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH keys for private flake inputs
        env:
          GH_FLAKE_B: ${{ secrets.GH_FLAKE_B }}
          NIX_ANYWHERE_SSH_KEY: ${{ secrets.NIX_ANYWHERE_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$GH_FLAKE_B" > ~/.ssh/flake-b
          echo "$NIX_ANYWHERE_SSH_KEY" > ~/.ssh/nix-anywhere
          chmod 600 ~/.ssh/flake-b ~/.ssh/nix-anywhere
          GH_SCAN=$(ssh-keyscan github.com 2>/dev/null)
          echo "$GH_SCAN" >> ~/.ssh/known_hosts
          echo "$GH_SCAN" | sed 's/^github.com/github.com-nix-anywhere/' >> ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<EOF
          # nix-anywhere locks lp-covertplay as git+ssh://git@github.com/...;
          # it is the only private input this job fetches, so its deploy key
          # serves github.com. nix-anywhere itself is cloned through an alias
          # with its own read-only deploy key.
          Host github.com
            User git
            IdentityFile ~/.ssh/flake-b
            IdentitiesOnly yes
          Host github.com-nix-anywhere
            HostName github.com
            User git
            IdentityFile ~/.ssh/nix-anywhere
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config

      - uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            access-tokens = github.com=${{ secrets.GH_TOKEN }}

      - uses: cachix/cachix-action@v15
        with:
          name: kantor-kana
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          installCommand: nix profile install nixpkgs#cachix

      # The host configuration moved from the GitLab nix-config to the
      # private GitHub repo nix-anywhere (2026-10-30).
      - name: Clone nix-anywhere
        run: |
          git clone git@github.com-nix-anywhere:kana-consultant/nix-anywhere.git /tmp/nix-anywhere
          echo "nix-anywhere $(git -C /tmp/nix-anywhere rev-parse HEAD)"

      - name: Build NixOS system
        id: build
        env:
          KANTOR_REF: ${{ inputs.kantor_ref }}
        run: |
          # Kantor comes from this checkout, or from KANTOR_REF (for example the
          # commit production runs, to see what the host config alone changes).
          # aysiem is a private input of the other machines (vps1-3): a stub
          # stands in for it so this job never fetches a repo it has no key for.
          kantor=.
          if [ -n "$KANTOR_REF" ]; then
            if ! [[ "$KANTOR_REF" =~ ^[0-9a-f]{40}$ ]]; then
              echo "kantor_ref must be a full 40-character commit SHA"
              exit 1
            fi
            kantor="github:kana-consultant/kantor/$KANTOR_REF"
          fi
          mkdir -p /tmp/flake-stub
          echo '{ outputs = _: { }; }' > /tmp/flake-stub/flake.nix
          SYSTEM=$(nix build \
            /tmp/nix-anywhere#nixosConfigurations.lp-covertplay.config.system.build.toplevel \
            --override-input kantor "$kantor" \
            --override-input nixpkgs "github:NixOS/nixpkgs/$NIXPKGS_REV" \
            --override-input aysiem path:/tmp/flake-stub \
            --print-out-paths --no-link)
          echo "path=$SYSTEM" >> "$GITHUB_OUTPUT"

      - name: Push to Cachix
        run: cachix push kantor-kana ${{ steps.build.outputs.path }}

      - name: Summary
        env:
          SYSTEM: ${{ steps.build.outputs.path }}
          KANTOR_REF: ${{ inputs.kantor_ref }}
          DEPLOYS: ${{ github.ref == 'refs/heads/main' && vars.AUTO_DEPLOY == 'true' && !inputs.kantor_ref }}
        run: |
          {
            echo "### lp-covertplay system"
            echo
            echo "- system: \`$SYSTEM\` (on Cachix kantor-kana)"
            echo "- kantor: \`${KANTOR_REF:-$GITHUB_SHA}\`"
            echo "- nix-anywhere: \`$(git -C /tmp/nix-anywhere rev-parse HEAD)\`"
            echo "- nixpkgs: \`$NIXPKGS_REV\`"
            echo
            if [ "$DEPLOYS" = "true" ]; then
              echo "This run deploys it."
            else
              echo "Not deployed: a deploy needs main, the repository variable AUTO_DEPLOY=true and no kantor_ref. Install it by hand (docs/deployment.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      # Off until the repository variable AUTO_DEPLOY is "true": the first
      # builds from nix-anywhere are installed by hand on the server after
      # comparing them with the running system. A kantor_ref run never
      # deploys (it may be older than production).
      - name: Deploy to server
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AUTO_DEPLOY == 'true' && !inputs.kantor_ref
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy-key
          chmod 600 ~/.ssh/deploy-key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null
          # Keepalives end a dead connection after ~5 minutes instead of
          # hanging until the job timeout; lenient, so a short network blip
          # does not cut switch-to-configuration off.
          echo -e "Host *\n  IdentityFile ~/.ssh/deploy-key\n  StrictHostKeyChecking accept-new\n  ConnectTimeout 20\n  ServerAliveInterval 30\n  ServerAliveCountMax 10" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # --substitute-on-destination: the server fetches paths that are
          # on a binary cache itself instead of the runner uploading them
          # over ssh (LibreOffice: ~0.7-0.85 GiB download, ~2.2 GiB on disk).
          nix copy --substitute-on-destination --to ssh://root@${{ secrets.DEPLOY_HOST }} ${{ steps.build.outputs.path }}
          ssh root@${{ secrets.DEPLOY_HOST }} "\
            nix-env -p /nix/var/nix/profiles/system --set ${{ steps.build.outputs.path }} && \
            ${{ steps.build.outputs.path }}/bin/switch-to-configuration switch"

      - name: Check backend health
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AUTO_DEPLOY == 'true' && !inputs.kantor_ref
        timeout-minutes: 10
        # Actions logs of this public repo are public: the remote script
        # prints only generic status, never journal lines, the unit's
        # environment or response bodies. Read the journal on the server.
        run: |
          ssh -o LogLevel=ERROR -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 root@${{ secrets.DEPLOY_HOST }} bash -s <<'REMOTE'
          set -u
          unit=kantor-backend
          port=$(systemctl show -p Environment --value "$unit" | tr ' ' '\n' | sed -n 's/^PORT=\([0-9][0-9]*\)$/\1/p' | head -n 1)
          if [ -z "$port" ]; then
            echo "$unit: no PORT in the unit environment (is services.kantor enabled?)"
            exit 1
          fi
          ready=0
          attempt=0
          # Up to ~3 minutes: migrations and startup tasks run before listen.
          deadline=$((SECONDS + 180))
          while [ "$SECONDS" -lt "$deadline" ]; do
            attempt=$((attempt + 1))
            status=$(timeout 5 bash -c 'exec 3<>"/dev/tcp/127.0.0.1/$1" && printf "GET /readyz HTTP/1.0\r\nHost: localhost\r\nConnection: close\r\n\r\n" >&3 && head -n 1 <&3' _ "$port" 2>/dev/null | tr -d '\r')
            case "$status" in
              "HTTP/1."[01]" 200"*) ready=1; break ;;
            esac
            sleep 5
          done
          echo "$unit: active=$(systemctl is-active "$unit") restarts=$(systemctl show -p NRestarts --value "$unit")"
          if [ "$ready" -ne 1 ]; then
            echo "$unit: /readyz did not return 200 within ~3 minutes; check 'journalctl -u $unit' on the server"
            exit 1
          fi
          echo "$unit: /readyz OK after $attempt attempt(s)"
          REMOTE
