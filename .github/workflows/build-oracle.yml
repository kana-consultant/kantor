name: Build images for Oracle (arm64)

# Fork-only workflow: builds the two images natively on an arm64 runner and pushes them to ghcr.
# Nothing is built on the Oracle box. Upstream's "Build & Deploy" workflow targets their own server:
# disable it in this fork (Actions tab → Build & Deploy → ... → Disable workflow, or delete deploy.yml).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # Upstream Dockerfile hardcodes GOARCH=amd64; Oracle is arm64.
      - name: Patch Dockerfile.backend for arm64
        run: sed -i 's/GOARCH=amd64/GOARCH=arm64/' Dockerfile.backend && grep -n GOARCH Dockerfile.backend
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Backend (with LibreOffice so payslips/contracts convert to PDF)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.backend
          platforms: linux/arm64
          build-args: WITH_LIBREOFFICE=true
          push: true
          tags: |
            ghcr.io/ekhacahya/kantor-app-backend:latest
            ghcr.io/ekhacahya/kantor-app-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.frontend
          platforms: linux/arm64
          build-args: VITE_API_BASE_URL=/api/v1
          push: true
          tags: |
            ghcr.io/ekhacahya/kantor-app-frontend:latest
            ghcr.io/ekhacahya/kantor-app-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
